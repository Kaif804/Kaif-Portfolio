<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" fill="none">
  <defs>
    <linearGradient id="kqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E61E00"/>
    </linearGradient>
    <filter id="kqDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF5500" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Monogram KQ Icon -->
  <g transform="translate(20, 20)">
    <!-- Letter K (Pure White) -->
    <path d="M 16 12 L 34 12 L 34 108 L 16 108 Z" fill="#FFFFFF"/>
    <path d="M 32 66 L 68 12 L 90 12 L 50 68 Z" fill="#FFFFFF"/>
    <path d="M 44 58 L 90 108 L 68 108 L 30 70 Z" fill="#FFFFFF"/>
    
    <!-- Letter Q with Wrench (Orange-Red Gradient) -->
    <g filter="url(#kqDrop)">
      <path fill-rule="evenodd" clip-rule="evenodd" 
        d="M 94 14 C 120 14 140 34 140 60 C 140 73 135 84 126 92 L 115 81 C 120 75 122 68 122 60 C 122 44.5 109.5 32 94 32 C 78.5 32 66 44.5 66 60 C 66 75.5 78.5 88 94 88 C 100 88 105 86 109 83 L 118 92 C 111 99 103 104 94 106 C 68 106 48 86 48 60 C 48 34 68 14 94 14 Z" 
        fill="url(#kqGrad)"/>
      <path d="M 112 84 L 134 106 L 146 94 L 134 82 L 123 93 L 117 87 Z" fill="url(#kqGrad)"/>
      <path d="M 128 100 L 144 116 L 154 106 L 142 94 L 136 100 Z" fill="url(#kqGrad)"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- KAIF -->
  <text x="210" y="86" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="56" letter-spacing="3">KAIF</text>
  <!-- QAISER -->
  <text x="365" y="86" fill="url(#kqGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="56" letter-spacing="3">QAISER</text>
  
  <!-- Subtitle: — WORDPRESS DEVELOPER — -->
  <line x1="210" y1="120" x2="250" y2="120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="264" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="600" font-size="16" letter-spacing="6">WORDPRESS DEVELOPER</text>
  <line x1="535" y1="120" x2="575" y2="120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
